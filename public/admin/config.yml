# ─────────────────────────────────────────────────────────────────────────────
# Editor visual da Vitualha (Sveltia CMS)
#
# Dois modos de uso:
#
#  1. LOCAL (recomendado no dia a dia, nao exige login nem servidor)
#     npm run dev  ->  http://localhost:4321/admin/
#     Clique em "Work with Local Repository" e escolha a pasta do projeto.
#     O CMS edita os arquivos .md direto no disco. Depois: git commit + push.
#
#  2. REMOTO (editar de qualquer lugar, inclusive do celular)
#     Preencha `repo` abaixo e configure o OAuth do GitHub.
#     Ver ARCHITECTURE.md > "Editando de qualquer lugar".
#
# Os campos aqui espelham o schema em src/content.config.ts. Campo a mais ou
# com nome trocado faz o build falhar de proposito — melhor quebrar no CI do
# que publicar um artigo com dado invalido.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: haynan1/vitualha
  branch: main
  # Descomente com a URL do seu Cloudflare Worker (sveltia-cms-auth) para
  # liberar o login pelo navegador, inclusive no celular. Sem esta linha o
  # editor remoto cai no provedor OAuth da Netlify, que nao esta configurado.
  #
  # Nao é segredo: é so o endereco do proxy que conduz o OAuth. O Client
  # Secret vive no Worker, nunca aqui — este arquivo é servido publicamente
  # em /admin/config.yml.
  #
  # Depois de preencher, some a mesma origem ao connect-src do
  # public/admin/.htaccess. Passo a passo em MANUAL.md.
  #
  # base_url: https://sveltia-cms-auth.SEU-SUBDOMINIO.workers.dev

# Grava direto no branch (sem pull request). Para revisao antes de publicar,
# troque para `publish_mode: editorial_workflow`.
publish_mode: simple

# Sem isso, um campo opcional deixado em branco vira string vazia no
# frontmatter e derruba a validacao de data/imagem no build.
output:
  omit_empty_optional_fields: true

# Onde as imagens enviadas pelo editor sao gravadas. `src/assets/uploads` e nao
# `public/`: so o que passa por `src/` entra no pipeline do astro:assets e sai
# como WebP responsivo.
#
# A barra inicial e obrigatoria na doc do Sveltia para caminho de colecao —
# "must start with a slash to indicate an absolute path from the root of the
# repository". Sem ela o caminho e resolvido contra a pasta da colecao e a
# imagem vai parar em `src/content/assets/uploads/`, que nenhum artigo alcanca.
#
# O frontmatter recebe esse mesmo caminho absoluto, e `src/content.config.ts`
# (helper `upload`) converte para o relativo que o `image()` do Astro exige.
media_folder: /src/assets/uploads
public_folder: /src/assets/uploads

i18n:
  # Um arquivo por idioma, em pastas irmas (pt/ e en/), com o MESMO nome de
  # arquivo. É esse nome que liga as duas traducoes.
  structure: multiple_folders
  locales: [pt, en]
  default_locale: pt

collections:
  # ── Artigos ───────────────────────────────────────────────────────────────
  - name: blog
    label: Artigos
    label_singular: Artigo
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    # `{{slug}}` e nao `{{fields.permalink}}`: com o endereco em branco — que é
    # o caso normal — o caminho virava `artigos/`, e o botao de ver no site
    # levava ao indice em vez do artigo.
    #
    # Limitacao conhecida: o Sveltia aceita um caminho so, entao artigo em
    # ingles com endereco proprio abre a versao em portugues. Um artigo
    # existente e correspondente é melhor destino que um 404, e nao ha sintaxe
    # condicional aqui para fazer melhor.
    preview_path: 'artigos/{{slug}}'
    # Sem media_folder proprio: vale o do topo, que ja aponta para
    # /src/assets/uploads. Override relativo aqui era o que desviava o upload.
    i18n: true
    format: yaml-frontmatter
    summary: '{{title}}'
    sortable_fields: [publishedAt, title, category]
    view_groups:
      - label: Categoria
        field: category
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - {
          name: summary,
          label: Resumo,
          widget: text,
          i18n: true,
          hint: 'Aparece no card, na busca e no Google. Entre 40 e 320 caracteres.',
        }
      # O `?` no fim do grupo é o que torna o campo realmente opcional. O
      # `pattern` do CMS roda mesmo em campo vazio: sem aceitar string vazia,
      # `required: false` nao vale nada — o editor marca erro em branco e
      # obriga a inventar um endereco, que é exatamente o oposto do que a dica
      # promete. O Zod continua exigindo o formato completo quando ha valor.
      - {
          name: permalink,
          label: Endereço (URL),
          widget: string,
          required: false,
          i18n: true,
          pattern: ['^([a-z0-9]+(?:-[a-z0-9]+)*)?$', 'Só minúsculas sem acento, números e hífen'],
          hint: 'Opcional. Em branco, usa o nome do arquivo. Use para dar uma URL própria em inglês.',
        }
      - {
          name: category,
          label: Categoria,
          widget: select,
          i18n: duplicate,
          options:
            [
              { label: 'Nutrição', value: nutrition },
              { label: 'Alimentos', value: foods },
              { label: 'Saúde', value: health },
              { label: 'Fitness', value: fitness },
              { label: 'Receitas', value: recipes },
              { label: 'Ciência', value: science },
            ],
        }
      - {
          name: publishedAt,
          label: Publicado em,
          widget: datetime,
          i18n: duplicate,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - {
          name: updatedAt,
          label: Atualizado em,
          widget: datetime,
          required: false,
          i18n: duplicate,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - {
          name: author,
          label: Autoria,
          widget: relation,
          required: false,
          i18n: duplicate,
          collection: authors,
          value_field: '{{slug}}',
          search_fields: [name],
          display_fields: [name],
          hint: 'Em branco, o artigo sai assinado pela publicação — a autoridade vem das Referências.',
        }
      - {
          name: reviewer,
          label: Revisão técnica,
          widget: relation,
          required: false,
          i18n: duplicate,
          collection: authors,
          value_field: '{{slug}}',
          search_fields: [name],
          display_fields: [name],
          hint: 'Obrigatório em conteúdo clínico, de suplementação ou com recomendação numérica.',
        }
      - { name: cover, label: Capa, widget: image, required: false, i18n: duplicate }
      - {
          name: coverAlt,
          label: Descrição da capa,
          widget: string,
          required: false,
          i18n: true,
          hint: 'Obrigatório quando há capa. Descreva a imagem para quem não a vê.',
        }
      - {
          name: tags,
          label: Tags,
          widget: list,
          required: false,
          i18n: true,
          max: 8,
          hint: 'Até 8. Usadas para sugerir artigos relacionados.',
        }
      - {
          name: featured,
          label: Destaque na home,
          widget: boolean,
          default: false,
          i18n: duplicate,
        }
      - {
          name: draft,
          label: Rascunho,
          widget: boolean,
          default: false,
          i18n: duplicate,
          hint: 'Rascunho aparece no ambiente local e nunca vai para o site publicado.',
        }
      - {
          name: noindex,
          label: Ocultar dos buscadores,
          widget: boolean,
          default: false,
          i18n: duplicate,
        }
      # Em lista com subcampos, `i18n: true` no campo NAO basta: o Sveltia so
      # habilita o botao de adicionar no painel do idioma nao padrao se ALGUM
      # subcampo declarar `i18n: true` — o padrao de subcampo é `false`
      # (list-editor-complex.svelte: `isAddDisabled = isDuplicateField ||
      # !hasEditableSubFields`). Sem isso o editor em ingles so consegue
      # reordenar o que ja existe, nunca acrescentar. Por isso cada subcampo
      # abaixo repete o `i18n: true`.
      - name: references
        label: Fontes científicas
        widget: list
        required: false
        i18n: true
        summary: '{{fields.title}}'
        fields:
          - { name: title, label: Título, widget: string, i18n: true }
          - {
              name: url,
              label: Link,
              widget: string,
              i18n: true,
              pattern: ['^https://', 'A fonte precisa usar https'],
            }
          - { name: publisher, label: Publicado por, widget: string, required: false, i18n: true }
      - name: faq
        label: Perguntas frequentes
        widget: list
        required: false
        i18n: true
        max: 10
        summary: '{{fields.question}}'
        fields:
          - { name: question, label: Pergunta, widget: string, i18n: true }
          - { name: answer, label: Resposta, widget: text, i18n: true }
      - {
          name: body,
          label: Conteúdo,
          widget: markdown,
          i18n: true,
          hint: 'Blocos de destaque: :::dica[Título] ... ::: — também :::atencao e :::nota',
        }

  # ── Páginas institucionais ────────────────────────────────────────────────
  - name: pages
    label: Páginas
    label_singular: Página
    folder: src/content/pages
    create: false
    delete: false
    i18n: true
    format: yaml-frontmatter
    fields:
      - { name: title, label: Título, widget: string, i18n: true }
      - { name: description, label: Descrição, widget: text, i18n: true }
      - {
          name: updatedAt,
          label: Atualizado em,
          widget: datetime,
          required: false,
          i18n: duplicate,
          date_format: 'YYYY-MM-DD',
          time_format: false,
          picker_utc: true,
        }
      - {
          name: noindex,
          label: Ocultar dos buscadores,
          widget: boolean,
          default: false,
          i18n: duplicate,
        }
      - { name: body, label: Conteúdo, widget: markdown, i18n: true }

  # ── Autoria ───────────────────────────────────────────────────────────────
  # Sem pasta por idioma: um arquivo por pessoa, com cargo e bio nos dois
  # idiomas dentro do proprio arquivo.
  - name: authors
    label: Autores
    label_singular: Autor
    folder: src/content/authors
    create: true
    slug: '{{slug}}'
    format: yaml-frontmatter
    summary: '{{name}}'
    fields:
      - { name: name, label: Nome, widget: string }
      - {
          name: credential,
          label: Registro profissional,
          widget: string,
          required: false,
          hint: 'Ex.: CRN-3 12345',
        }
      - name: role
        label: Cargo
        widget: object
        fields:
          - { name: pt, label: Português, widget: string }
          - { name: en, label: English, widget: string }
      - name: bio
        label: Minibiografia
        widget: object
        fields:
          - { name: pt, label: Português, widget: text }
          - { name: en, label: English, widget: text }
      - { name: avatar, label: Foto, widget: image, required: false }
      - name: links
        label: Links
        widget: object
        required: false
        fields:
          - { name: website, label: Site, widget: string, required: false }
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: linkedin, label: LinkedIn, widget: string, required: false }
