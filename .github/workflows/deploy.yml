name: Deploy

# Publica em producao apenas o artefato que passou pela CI. O site nunca é
# construido "de novo, direto no deploy": o que sobe é exatamente o que foi
# validado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, sem cancelar o que ja comecou: interromper um envio FTP
# no meio deixaria o public_html em estado misto.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publicar:
    name: Enviar para a Hostinger
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: ${{ vars.PUBLIC_SITE_URL }}

    steps:
      - name: Baixar o site construido
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Conferir que o artefato veio inteiro
        run: |
          test -f dist/index.html || { echo "dist/index.html ausente"; exit 1; }
          test -f dist/.htaccess || { echo ".htaccess ausente — o site subiria sem cabecalho de seguranca"; exit 1; }
          test -d dist/pagefind || { echo "indice de busca ausente"; exit 1; }
          echo "Arquivos: $(find dist -type f | wc -l)"

      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (canal criptografado). A Hostinger aceita nas contas
          # compartilhadas; FTP puro enviaria a senha em texto claro.
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: public_html/
          # A acao mantem um estado no servidor e envia so o que mudou —
          # um artigo novo nao reenvia o site inteiro.
          state-name: .ftp-deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-state.json
