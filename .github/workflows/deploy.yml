name: Deploy

# Publica em producao apenas o artefato que passou pela CI. O site nunca é
# construido "de novo, direto no deploy": o que sobe é exatamente o que foi
# validado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, sem cancelar o que ja comecou: interromper um envio FTP
# no meio deixaria o public_html em estado misto.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publicar:
    name: Enviar para a Hostinger
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: ${{ vars.PUBLIC_SITE_URL }}

    steps:
      # Credencial ausente ou com formato errado so apareceria la na frente,
      # como timeout do cliente FTP, sem dizer o que corrigir. Conferir antes
      # troca o timeout por uma instrucao — e roda antes do download do
      # artefato, para falhar no primeiro segundo do job.
      #
      # Nenhum valor é impresso: o teste é de presenca e de formato. O Actions
      # mascara secrets no log, mas mascaramento é ultima linha de defesa, nao
      # primeira — o jeito de nao vazar um segredo é nao imprimi-lo.
      - name: Conferir credenciais antes de conectar
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          ausentes=()
          [ -n "$FTP_SERVER" ]   || ausentes+=("FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || ausentes+=("FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || ausentes+=("FTP_PASSWORD")

          if [ ${#ausentes[@]} -gt 0 ]; then
            echo "::error::Secret(s) ausente(s): ${ausentes[*]}"
            echo "Defina em Settings > Secrets and variables > Actions > aba Secrets."
            echo "Os valores estao no hPanel da Hostinger, em Arquivos > Contas FTP."
            exit 1
          fi

          # Erro comum: colar a URL inteira em vez do host. O cliente tenta
          # resolver "ftp://host" como nome de maquina e morre por timeout.
          case "$FTP_SERVER" in
            *://*)
              echo "::error::FTP_SERVER inclui esquema de protocolo. Use so o host, sem ftp:// nem https://."
              exit 1
              ;;
          esac

          # Nao é fatal: o astro.config.ts tem dominio padrao. Mas se o dominio
          # real for outro, o artefato ja subiu com canonical, sitemap, RSS e
          # JSON-LD apontando para o lugar errado — e isso nao aparece na tela.
          if [ -z "$SITE_URL" ]; then
            echo "::warning::PUBLIC_SITE_URL nao definido em Variables — o site foi construido com o dominio padrao do astro.config.ts."
          fi

          # A acao trata server-dir como caminho de diretorio: sem a barra
          # final ela concatena com o nome do arquivo e cria caminho irmao.
          case "${FTP_SERVER_DIR:-public_html/}" in
            */) ;;
            *)
              echo "::error::FTP_SERVER_DIR precisa terminar com barra, ex: domains/exemplo.com/public_html/"
              exit 1
              ;;
          esac

          echo "Credenciais presentes e com formato plausivel."
          echo "Destino: ${FTP_SERVER_DIR:-public_html/}"

      - name: Baixar o site construido
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Conferir que o artefato veio inteiro
        run: |
          test -f dist/index.html || { echo "dist/index.html ausente"; exit 1; }
          test -f dist/.htaccess || { echo ".htaccess ausente — o site subiria sem cabecalho de seguranca"; exit 1; }
          test -d dist/pagefind || { echo "indice de busca ausente"; exit 1; }
          echo "Arquivos: $(find dist -type f | wc -l)"

      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (canal criptografado). A Hostinger aceita nas contas
          # compartilhadas; FTP puro enviaria a senha em texto claro.
          protocol: ftps
          port: 21
          # O padrao da acao é 30s, e foi exatamente onde o envio morreu com
          # "Timeout (control socket)". A propria Hostinger orienta a subir o
          # tempo limite do cliente quando o servidor compartilhado demora a
          # responder — o gargalo é a fila do servidor, nao a rede do runner.
          timeout: 120000
          local-dir: ./dist/
          # Configuravel porque o caminho depende do arranjo da hospedagem, e
          # nao do projeto: conta FTP da raiz usa public_html/, dominio
          # adicional usa domains/exemplo.com/public_html/, e conta FTP criada
          # ja apontada para a pasta do site usa ./ — o valor certo é o que o
          # hPanel mostra em Contas FTP. Fixar isso no codigo custou um dia.
          #
          # Neste projeto o valor correto é /domains/vitualha.com/public_html/,
          # definido na Variable. O padrao public_html/ abaixo esta errado para
          # esta conta e fica so como rede de seguranca: a conta cai dentro de
          # /public_html, entao public_html/ criaria /public_html/public_html/.
          # Descobrir isso exigiu ler o servidor — ver diagnostico-ftp.yml.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # A acao mantem um estado no servidor e envia so o que mudou —
          # um artigo novo nao reenvia o site inteiro.
          state-name: .ftp-deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-state.json

      # "Deploy verde" precisa significar "site no ar", e nao "arquivo em
      # algum lugar do servidor". Um server-dir apontando para fora da raiz
      # que o dominio serve envia tudo, devolve sucesso e deixa o site antigo
      # publicado — sem nenhum sinal de erro. Foi exatamente o que aconteceu
      # aqui, e so apareceu porque alguem foi olhar o site com a mao.
      #
      # A checagem busca o /robots.txt porque ele é gerado a partir do `site`
      # do build: se responde com a linha Sitemap, o que esta publicado veio
      # deste artefato, e nao de um arquivo antigo que sobrou na pasta.
      - name: Conferir que o site publicado é este
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          base="${SITE_URL:-https://vitualha.com}"
          base="${base%/}"

          # Hospedagem compartilhada leva alguns segundos para expor o que
          # acabou de chegar por FTP; tres tentativas evitam falso negativo.
          for tentativa in 1 2 3; do
            if curl -fsS --max-time 20 "$base/robots.txt" | grep -q '^Sitemap:'; then
              echo "Publicado e respondendo em $base."
              exit 0
            fi
            sleep 5
          done

          echo "::error::$base/robots.txt nao responde com o conteudo deste build."
          echo "O envio FTP terminou sem erro, entao o mais provavel é o destino:"
          echo "os arquivos foram para uma pasta que este dominio nao serve."
          echo "Veja o diretorio da conta FTP no hPanel (Arquivos > Contas FTP) e"
          echo "ajuste a Variable FTP_SERVER_DIR para esse caminho, com barra no fim."
          exit 1
