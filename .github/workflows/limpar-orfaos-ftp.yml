name: Limpar orfaos FTP

# Apaga o conteudo de /public_html/ — a pasta onde a conta FTP cai, que este
# dominio NAO serve, e onde tres deploys mal direcionados deixaram duas copias
# completas do site.
#
# A pasta que o dominio serve é /domains/vitualha.com/public_html/. Os nomes
# sao quase identicos e a diferenca é um prefixo: por isso este workflow prova
# onde esta antes de apagar, e prova que o site continua no ar depois.
#
# Uso unico. Removido do repositorio depois de rodar — ferramenta que apaga
# arquivo em producao nao fica de plantao.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite APAGAR para confirmar'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  limpar:
    name: Apagar as copias orfas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Exigir confirmacao explicita
        if: inputs.confirmar != 'APAGAR'
        run: |
          echo "::error::Confirmacao ausente. Rode de novo digitando APAGAR."
          exit 1

      # Se o site ja estivesse fora do ar antes de comecar, a checagem final
      # nao provaria nada — passar a limpeza sem esse ponto de partida seria
      # apagar as pastas as cegas.
      - name: Confirmar que o site esta no ar ANTES
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 20 https://vitualha.com/robots.txt | grep -q '^Sitemap:'; then
            echo "::error::O site nao esta respondendo antes da limpeza. Abortando."
            exit 1
          fi
          echo "Site no ar. Pode prosseguir."

      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Apagar o conteudo de /public_html/
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          conectar="$(mktemp)"; alvos="$(mktemp)"; roteiro="$(mktemp)"
          trap 'rm -f "$conectar" "$alvos" "$roteiro"' EXIT

          cabecalho() {
            echo 'set ssl:verify-certificate no'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set net:timeout 30'
            echo 'set net:max-retries 2'
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
          }

          # ---- 1. Levantar o que existe, sem apagar nada ainda ----
          { cabecalho; echo 'cls -1 -a /public_html/'; echo 'bye'; } > "$conectar"
          lftp -f "$conectar" \
            | sed 's#/$##' \
            | grep -vE '^\.\.?$' \
            | grep -vE '^[[:space:]]*$' > "$alvos" || true

          total=$(wc -l < "$alvos")
          echo "Itens encontrados em /public_html/: $total"
          echo "----------------------------------------"
          cat "$alvos"
          echo "----------------------------------------"

          if [ "$total" -eq 0 ]; then
            echo "Nada a apagar — a pasta ja esta vazia."
            exit 0
          fi

          # ---- 2. Travas de seguranca ----
          # Um nome contendo "domains" aqui significaria que a listagem nao veio
          # de onde eu penso que veio. Melhor abortar do que apagar no escuro.
          if grep -qi 'domains' "$alvos"; then
            echo "::error::Achei 'domains' na listagem de /public_html/. Isso nao deveria acontecer. Abortando."
            exit 1
          fi

          # ---- 3. Apagar item a item, com caminho absoluto ----
          # Nada de glob: `rm -rf *` depende de como o servidor expande o
          # asterisco, e um `..` que escapasse levaria a pasta do site junto.
          # Caminho absoluto e explicito, montado a partir da listagem real.
          {
            cabecalho
            while IFS= read -r item; do
              [ -n "$item" ] || continue
              echo "echo -- removendo /public_html/$item"
              echo "rm -rf \"/public_html/$item\""
            done < "$alvos"
            echo 'echo ===SOBROU==='
            echo 'cls -1 -a /public_html/'
            echo 'bye'
          } > "$roteiro"

          lftp -f "$roteiro" 2>&1 || true

      # A prova de que a limpeza acertou o alvo: o site tem que continuar
      # respondendo com este build. Se caiu, a pasta errada foi apagada — e o
      # deploy reconstroi tudo, porque a fonte de verdade é o repositorio.
      - name: Confirmar que o site continua no ar DEPOIS
        run: |
          set -euo pipefail
          for tentativa in 1 2 3; do
            if curl -fsS --max-time 20 https://vitualha.com/robots.txt | grep -q '^Sitemap:'; then
              echo "Site no ar. A limpeza atingiu so as copias orfas."
              exit 0
            fi
            sleep 5
          done
          echo "::error::O site parou de responder depois da limpeza."
          echo "Rode o workflow Deploy para republicar — o repositorio é a fonte de verdade."
          exit 1
