name: Diagnostico FTP

# Mapeia o servidor por leitura, sem escrever nada, para descobrir qual pasta
# o dominio realmente serve. Existe porque o alternativa era chutar o caminho
# no FTP_SERVER_DIR: cada chute errado deixa uma copia inteira do site numa
# pasta orfa, ocupando espaco e inode, e sem dizer onde estava o certo.
#
# Manual de proposito (workflow_dispatch): nao roda em push, nao participa do
# deploy, e so gasta conexao quando alguem esta investigando.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapear:
    name: Mapear o servidor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar o lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Todo acesso é de leitura: pwd, ls e find. Nenhum comando escreve,
      # remove ou renomeia — rodar isto nao pode piorar o estado do servidor.
      #
      # A senha vai num arquivo temporario do runner em vez da linha de
      # comando, que ficaria visivel em `ps`. O runner é efemero e o Actions
      # mascara secrets na saida, mas nenhum dos dois é motivo para expor.
      - name: Listar a arvore e achar a raiz do site
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          roteiro="$(mktemp)"
          saida="$(mktemp)"
          trap 'rm -f "$roteiro" "$saida"' EXIT

          {
            echo 'set ssl:verify-certificate no'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set net:timeout 30'
            echo 'set net:max-retries 2'
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
            # A pasta onde a conta cai ja foi mapeada e contem uma copia do
            # site que o dominio nao serve. O que falta é subir na hierarquia:
            # se a conta nao estiver presa (chroot), a pasta real do dominio
            # aparece em domains/<dominio>/public_html/.
            #
            # Caminhos que contenham o nome de usuario saem mascarados como
            # *** no log — o Actions nao sabe distinguir caminho de segredo.
            # Por isso o que interessa aqui sao os NOMES das pastas listadas,
            # que reconstroem o caminho sem depender do pwd sair legivel.
            echo 'echo ===PWD-DO-LOGIN==='
            echo 'pwd'
            echo 'echo ===PASTA-PAI==='
            echo 'cd ..'
            echo 'pwd'
            echo 'cls -l --sort=name'
            echo 'echo ===DOIS-NIVEIS-ACIMA==='
            echo 'cd ..'
            echo 'pwd'
            echo 'cls -l --sort=name'
            echo 'echo ===RAIZ-ABSOLUTA==='
            echo 'cd /'
            echo 'pwd'
            echo 'cls -l --sort=name'
            echo 'echo ===ARVORE-A-PARTIR-DA-RAIZ==='
            echo 'find -d 3'
            echo 'bye'
          } > "$roteiro"

          # Um `cd` recusado nao é falha do diagnostico: conta presa em chroot
          # é justamente uma das respostas que este job existe para dar.
          lftp -f "$roteiro" 2>&1 | tee "$saida" || true

          echo ""
          echo "================================================================"
          echo "  Candidatos a raiz do site"
          echo "================================================================"
          echo ""
          grep -inE 'domains|public_html|index\.html|default\.php' "$saida" | head -80 || true

          echo ""
          echo "A pasta certa é a que contem o index.html de ~598527 bytes (o"
          echo "mockup que o dominio serve hoje) ou o default.php da Hostinger."
          echo "Esse caminho vira a Variable FTP_SERVER_DIR, com barra no final."
